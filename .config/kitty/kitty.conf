allow_remote_control yes
scrollback_pager_history_size 50
shell_integration enabled
confirm_os_window_close -1 count-background
notify_on_cmd_finish invisible 8.0

hide_window_decorations yes
window_padding_width 0
window_border_width 2.0
window_margin_width 0

tab_bar_edge bottom
tab_bar_margin_width 10.0
tab_bar_min_tabs 1
tab_bar_style powerline

shell /run/current-system/sw/bin/zsh
editor /run/current-system/sw/bin/nvim

allow_remote_control yes
listen_on unix:/tmp/mykitty

enabled_layouts tall:bias=70;full_size=1;mirrored=false
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l

font_family	Comic Code
italic_font      auto
bold_font        auto
bold_italic_font auto

font_size	16.0

active_border_color #de3d35
inactive_border_color #d0d0d0

active_tab_foreground   #f8f8f8
active_tab_background   #3e953a
inactive_tab_foreground #2a2b33
inactive_tab_background #d0d0d0

selection_background #ececec
selection_foreground #2a2b33

background #f8f8f8
foreground #2a2b33
cursor #bbbbbb

color0 #000000
color1 #de3d35
color2 #3e953a
color3 #d2b67b
color4 #2f5af3
color5 #950095
color6 #3e953a
color7 #bbbbbb
color8 #000000
color9 #de3d35
color10 #3e953a
color11 #d2b67b
color12 #2f5af3
color13 #a00095
color14 #3e953a
color15 #ffffff






